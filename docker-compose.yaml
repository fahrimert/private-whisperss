version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pw-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: pw-api
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

  worker:
    build: ./ai-worker
    container_name: pw-worker
    volumes:
      - ./backend/uploads:/app/uploads
      - ./hf_cache:/root/.cache/huggingface
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PYTHONUNBUFFERED=1